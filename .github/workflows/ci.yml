name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compatibility:
    name: Install on ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', 'lts/*']
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate metadata and schemas
        run: npm run validate

      - name: Verify installation and replacement
        run: node scripts/test-installer.mjs

      - name: Verify CLI package
        run: node scripts/test-npm-package.mjs

      - name: Verify packed CLI on minimum Node
        if: runner.os == 'Linux' && matrix.node == '18'
        run: npm run test:npm

  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --package-lock=false --no-audit --no-fund
          fi

      - name: Check script syntax
        run: find scripts -type f -name '*.mjs' -print0 | xargs -0 -n 1 node --check

      - name: Validate schemas, Skills, and workflow registry
        run: npm run validate

      - name: Run core tests
        run: npm run test:core

      - name: Run new-user UX tests
        run: npm run test:ux

      - name: Run public npm tarball tests
        run: npm run test:npm

      - name: Build all generated outputs
        run: npm run build

      - name: Generate deterministic documentation
        run: npm run docs:generate

      - name: Check documentation
        run: npm run docs:check

      - name: Check Skill and generated-output quality
        run: npm run quality:check

      - name: Check development metadata
        run: npm run release:check -- --development

      - name: Check tagged release metadata and evidence
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run release:check

      - name: Check generated-file drift
        run: git diff --exit-code -- skills plugins docs/SKILL_CATALOG.md docs/SKILL_CATALOG.zh-CN.md
