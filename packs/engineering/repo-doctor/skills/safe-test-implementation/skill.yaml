id: repo.safe-test-implementation
name:
  en: Safe Test Implementation
  zh-CN: 安全补充测试
category: engineering
visibility: public
version: 0.4.0
status: beta
default_locale: zh-CN
supported_locales:
  - en
  - zh-CN
description:
  en: Protect one externally observable behavior through a gated red–green–organize cycle in test_first, regression_after_fix, or characterization mode. Use only for explicitly authorized test, fixture, and necessary test-helper edits; inspect real commands and public test boundaries first. Do not auto-invoke for production fixes, modify production code, install dependencies, or write coverage-only assertions.
  zh-CN: 通过有门禁的红—绿—整理循环，一次保护一个外部可观察行为，可选 test_first、regression_after_fix 或 characterization。仅用于已明确授权的测试、fixture 和必要测试辅助代码修改；先检查真实命令与公共测试边界。生产修复不得自动调用，也不得修改生产代码、安装依赖或只为覆盖率补断言。
triggers:
  en:
    - implement this test first before the behavior
    - add a regression test after this verified fix
    - characterize this legacy behavior with tests
    - safe test implementation
  zh-CN:
    - 在实现行为前测试先行
    - 为这个已验证修复补回归测试
    - 用测试刻画这段旧行为
    - 安全补充测试
tool_requirements:
  filesystem: write
  git: optional
  shell: optional
  web: none
permissions:
  read_files: true
  write_files: true
  run_shell_commands: true
  access_network: false
  destructive_actions_allowed: false
risk_level:
  default: safe_edit
execution:
  classification: standard
  default_mode: fast
  allow_implicit_invocation: true
output_schema:
  type: test_implementation_report
localization:
  en:
    status: complete
  zh-CN:
    status: complete
