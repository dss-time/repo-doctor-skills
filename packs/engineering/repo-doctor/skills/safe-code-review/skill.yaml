id: repo.safe-code-review
name:
  en: Safe Code Review
  zh-CN: 安全代码审查
category: engineering
visibility: public
version: 0.3.0
status: beta
default_locale: zh-CN
supported_locales:
  - en
  - zh-CN
description:
  en: Review a concrete diff or PR through three independent axes: repository conformance, change-intent fidelity, and operational safety, then deduplicate evidence-backed findings. Use automatically for broad change review, not specialist-only security, performance, API, or migration assessment. Read-only: never implement fixes without a separate explicit request and write authorization.
  zh-CN: 通过仓库符合度、变更意图忠实度和运行安全三个独立轴审查具体 Diff 或 PR，再对有证据的问题去重。适合自动承接广泛变更审查，不吸收单一安全、性能、API 或迁移专项。本 Skill 只读；没有独立明确请求和写权限时绝不实施修复。
triggers:
  en:
    - review this code
    - check this diff
    - safe code review
  zh-CN:
    - 审查代码
    - 检查当前 diff
    - 安全代码审查
    - 帮我 review 一下
tool_requirements:
  filesystem: read
  git: optional
  shell: optional
  web: none
permissions:
  read_files: true
  write_files: false
  run_shell_commands: false
  access_network: false
  destructive_actions_allowed: false
risk_level:
  default: read_only
execution:
  classification: standard
  default_mode: fast
  allow_implicit_invocation: true
output_schema:
  type: review_report
localization:
  en:
    status: complete
  zh-CN:
    status: complete
