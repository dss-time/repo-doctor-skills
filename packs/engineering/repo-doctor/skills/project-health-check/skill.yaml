id: repo.project-health-check
name:
  en: Project Health Check
  zh-CN: 项目体检
category: engineering
visibility: public
version: 0.1.0
status: beta
default_locale: zh-CN
supported_locales:
  - en
  - zh-CN
description:
  en: Explicit-invocation broad repository diagnosis across architecture, correctness, security, performance, dependencies, tests, and general release risk. Do not trigger for a bounded file, error, diff, or simple request. Use a specialized review for one dependency upgrade, API contract, migration, dead-code candidate, security surface, performance regression, configuration scope, or release candidate.
  zh-CN: 仅显式调用的全仓库诊断，覆盖架构、正确性、安全、性能、依赖、测试和一般发布风险。不得因单个文件、明确报错、Diff 或简单请求而触发。单一依赖升级、API 契约、迁移、死代码候选、安全边界、性能回归、配置范围或候选版本应使用对应专项 Skill。
triggers:
  en:
    - project health check
    - diagnose this repository
    - architecture review
  zh-CN:
    - 项目体检
    - 检查项目健康度
    - 架构审查
tool_requirements:
  filesystem: read
  git: optional
  shell: optional
  web: none
permissions:
  read_files: true
  write_files: false
  run_shell_commands: false
  access_network: false
  destructive_actions_allowed: false
risk_level:
  default: read_only
execution:
  classification: heavyweight
  default_mode: standard
  allow_implicit_invocation: false
output_schema:
  type: health_check_report
localization:
  en:
    status: complete
  zh-CN:
    status: complete
