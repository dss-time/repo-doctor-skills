id: repo.security-focused-review
name:
  en: Security Focused Review
  zh-CN: 安全专项审查
category: engineering
visibility: public
version: 0.1.0
status: beta
default_locale: zh-CN
supported_locales:
  - en
  - zh-CN
description:
  en: Explicit-invocation scoped security review that establishes assets, trust boundaries, attacker prerequisites, and evidence-backed findings across the named security surface. Do not trigger for general code review, run attacks, access production, reveal credentials, or implement fixes.
  zh-CN: 仅显式调用：针对指定安全边界建立资产、信任边界和攻击前提，并输出有证据的专项发现。不得因普通代码审查而触发，不执行攻击、不访问生产、不显示凭据，也不实施修复。
triggers:
  en: [perform a security focused review, review this authentication boundary for vulnerabilities, security focused review]
  zh-CN: [执行安全专项审查, 审查这个认证边界的漏洞, 安全专项审查]
tool_requirements:
  filesystem: read
  git: optional
  shell: optional
  web: optional
permissions:
  read_files: true
  write_files: false
  run_shell_commands: false
  access_network: false
  destructive_actions_allowed: false
risk_level: {default: read_only}
execution:
  classification: explicit-only-candidate
  default_mode: standard
  allow_implicit_invocation: false
output_schema: {type: security_review_report}
localization:
  en: {status: complete}
  zh-CN: {status: complete}
