id: repo.session-handoff
name:
  en: Session Handoff
  zh-CN: 会话交接
category: engineering
visibility: public
version: 0.2.0
status: beta
default_locale: zh-CN
supported_locales:
  - en
  - zh-CN
description:
  en: Explicit-invocation Skill that creates a sanitized continuation brief tailored to the next-session goal, referencing specifications, ADRs, issues, commits, and diffs instead of copying them. Save to an operating-system temporary directory by default; project-directory writes require authorization. Never modify business files, Git state, or external systems.
  zh-CN: 仅显式调用：创建面向下一会话目标的脱敏续接摘要，通过路径、ADR、Issue、Commit 和 Diff 引用既有产物而不重复全文。默认保存到操作系统临时目录；写入项目目录必须授权。绝不修改业务文件、Git 状态或外部系统。
triggers:
  en:
    - prepare this session for another agent
    - create a continuation brief for the next session
    - summarize the current repository work so it can resume
    - session handoff
  zh-CN:
    - 把当前会话交接给另一个 Agent
    - 为下一会话生成续接摘要
    - 整理当前仓库工作以便继续
    - 会话交接
tool_requirements:
  filesystem: write
  git: optional
  shell: none
  web: none
permissions:
  read_files: true
  write_files: true
  run_shell_commands: false
  access_network: false
  destructive_actions_allowed: false
risk_level:
  default: safe_edit
execution:
  classification: explicit-only-candidate
  default_mode: standard
  allow_implicit_invocation: false
output_schema:
  type: session_handoff_brief
localization:
  en:
    status: complete
  zh-CN:
    status: complete
