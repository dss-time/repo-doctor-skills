input: "使用 audit 模式诊断这个 500 错误但不要修复，先建立可信的成败观测信号。"
expected:
  must_include:
    - audit
    - 合格信号
    - 成功判据
    - 失败判据
    - 最小复现
    - 触发条件
    - 直接原因
    - 系统性根因
    - 反证方法
    - 命令账本
    - 工作目录
    - 退出码
    - Observed / Reproduced / Inferred / Unverified / Blocked
    - 置信度
    - 回归保护
  must_not:
    - 修改文件
    - 实施修复
    - 安装依赖
    - 执行破坏性命令
    - 未执行命令却声称已复现
    - 没有合格信号却给出高置信根因
