id: repo.bug-root-cause-analysis
name:
  en: Bug Root Cause Analysis
  zh-CN: Bug 根因分析
category: engineering
visibility: public
version: 0.3.0
status: beta
default_locale: zh-CN
supported_locales:
  - en
  - zh-CN
description:
  en: Diagnose a specific non-CI runtime bug by first qualifying a repeatable success/failure signal, then using minimal reproduction, boundary isolation, and falsifiable experiments to separate trigger, direct cause, and systemic root cause. Use automatically only when a concrete runtime symptom exists. Do not use for CI failures, broad review, test writing, or fix implementation; the Skill is read-only and defaults to concise output.
  zh-CN: 针对具体非 CI 运行时 Bug，先确认可重复且能区分成败的观测信号，再通过最小复现、故障边界和可证伪实验区分触发条件、直接原因与系统性根因。只有存在具体运行症状时适合自动调用；CI 故障、广泛审查、编写测试或实施修复不使用。本 Skill 只读且默认简洁输出。
triggers:
  en:
    - find the root cause of this bug
    - reproduce and diagnose this failure
    - why does this error happen
    - bug root cause analysis
  zh-CN:
    - 分析这个 Bug 的根因
    - 复现并定位这个故障
    - 这个错误为什么发生
    - Bug 根因分析
tool_requirements:
  filesystem: read
  git: optional
  shell: optional
  web: none
permissions:
  read_files: true
  write_files: false
  run_shell_commands: true
  access_network: false
  destructive_actions_allowed: false
risk_level:
  default: tool_execution
output_schema:
  type: root_cause_report
localization:
  en:
    status: complete
  zh-CN:
    status: complete
