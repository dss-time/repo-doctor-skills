id: repo.architecture-decision-record
name:
  en: Architecture Decision Record
  zh-CN: 架构决策记录
category: engineering
visibility: public
version: 0.1.0
status: beta
default_locale: zh-CN
supported_locales:
  - en
  - zh-CN
description:
  en: Explicit-invocation Skill to create or update an ADR from a real architectural problem, evidence, alternatives, tradeoffs, and an explicit decision state while respecting repository conventions. Requires authorized ADR scope; do not fabricate consensus, plan implementation, or modify business code.
  zh-CN: 仅显式调用：根据真实架构问题、证据、候选方案、权衡和明确决策状态创建或更新 ADR，并遵循仓库约定。必须获得 ADR 范围授权；不虚构共识、不生成实施计划，也不修改业务代码。
triggers:
  en: [create an architecture decision record, update this ADR, document this architecture decision]
  zh-CN: [创建架构决策记录, 更新这个 ADR, 记录这个架构决策]
tool_requirements:
  filesystem: write
  git: optional
  shell: none
  web: optional
permissions:
  read_files: true
  write_files: true
  run_shell_commands: false
  access_network: false
  destructive_actions_allowed: false
risk_level: {default: safe_edit}
execution:
  classification: standard
  default_mode: standard
  allow_implicit_invocation: false
output_schema: {type: architecture_decision_record}
localization:
  en: {status: complete}
  zh-CN: {status: complete}
