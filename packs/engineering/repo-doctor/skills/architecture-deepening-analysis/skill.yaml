id: repo.architecture-deepening-analysis
name:
  en: Architecture Deepening Analysis
  zh-CN: 架构深化分析
category: engineering
visibility: public
version: 0.1.0
status: beta
default_locale: zh-CN
supported_locales:
  - en
  - zh-CN
description:
  en: Explicit-invocation, read-only analysis of evidence-backed architecture friction and migratable, reversible deepening options after concrete caller or change evidence exists. Do not trigger for a simple refactor, judge by file size, create speculative abstractions, or write files.
  zh-CN: 仅显式调用：在已有具体调用方或变更证据后，只读分析架构摩擦并比较可迁移、可回滚的深化方案。不得因简单重构而触发、按文件大小下结论、创建推测性抽象或写入文件。
triggers:
  en:
    - analyze why this architecture is hard to change
    - find broad interfaces and caller burden
    - compare reversible module deepening options
    - architecture deepening analysis
  zh-CN:
    - 分析这个架构为什么越来越难改
    - 查找过宽接口和调用方负担
    - 比较可回滚的模块深化方案
    - 架构深化分析
tool_requirements:
  filesystem: read
  git: optional
  shell: optional
  web: none
permissions:
  read_files: true
  write_files: false
  run_shell_commands: true
  access_network: false
  destructive_actions_allowed: false
risk_level:
  default: tool_execution
execution:
  classification: explicit-only-candidate
  default_mode: standard
  allow_implicit_invocation: false
output_schema:
  type: architecture_deepening_analysis_report
localization:
  en:
    status: complete
  zh-CN:
    status: complete
