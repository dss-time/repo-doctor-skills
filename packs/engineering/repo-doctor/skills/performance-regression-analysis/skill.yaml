id: repo.performance-regression-analysis
name:
  en: Performance Regression Analysis
  zh-CN: 性能回归分析
category: engineering
visibility: public
version: 0.1.0
status: beta
default_locale: zh-CN
supported_locales:
  - en
  - zh-CN
description:
  en: Explicit-invocation analysis of one measured performance regression against a defined baseline and workload using profiles, benchmarks, traces, logs, or reproducible experiments. Do not trigger for ordinary slowness guesses, replace general code review, or optimize code.
  zh-CN: 仅显式调用：针对明确基线和工作负载，使用 profile、benchmark、trace、日志或可复现实验分析一个已测量的性能回归。不得因普通性能猜测而触发，不替代代码审查，也不优化代码。
triggers:
  en: [analyze this performance regression, compare this benchmark to baseline, performance regression analysis]
  zh-CN: [分析这个性能回归, 对比基线和 benchmark, 性能回归分析]
tool_requirements:
  filesystem: read
  git: optional
  shell: optional
  web: none
permissions:
  read_files: true
  write_files: false
  run_shell_commands: false
  access_network: false
  destructive_actions_allowed: false
risk_level: {default: read_only}
execution:
  classification: explicit-only-candidate
  default_mode: standard
  allow_implicit_invocation: false
output_schema: {type: performance_regression_report}
localization:
  en: {status: complete}
  zh-CN: {status: complete}
