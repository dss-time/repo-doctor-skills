id: repo.repo-doctor-router
name:
  en: Repo Doctor Router
  zh-CN: 工作流路由
category: engineering
visibility: public
version: 0.2.0
status: beta
default_locale: zh-CN
supported_locales:
  - en
  - zh-CN
description:
  en: Recommend one verified Repo Doctor Skill and fast, standard, or audit mode from the current repository state, or return a registered workflow when detailed routing is requested. Use automatically only when the user asks which Skill or next safe step fits. Do not execute the recommendation, route ordinary factual questions, invent aliases, or bypass permission gates.
  zh-CN: 根据当前仓库状态推荐一个已核验 Repo Doctor Skill 及 fast、standard 或 audit 模式；用户要求详细路由时再返回注册工作流。只有用户询问该用哪个 Skill 或下一安全步骤时适合自动调用。不得执行推荐、路由普通知识问答、编造别名或绕过权限门禁。
triggers:
  en:
    - which Repo Doctor Skill should I use
    - recommend the next repository workflow step
    - route this engineering task
    - I do not know which Skill fits
  zh-CN:
    - 我该用哪个 Repo Doctor Skill
    - 推荐下一步仓库工作流
    - 路由这个工程任务
    - 我不知道该选哪个 Skill
tool_requirements:
  filesystem: read
  git: none
  shell: none
  web: none
permissions:
  read_files: true
  write_files: false
  run_shell_commands: false
  access_network: false
  destructive_actions_allowed: false
risk_level:
  default: read_only
output_schema:
  type: repo_doctor_routing_report
localization:
  en:
    status: complete
  zh-CN:
    status: complete
