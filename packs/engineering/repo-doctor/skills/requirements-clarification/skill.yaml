id: repo.requirements-clarification
name:
  en: Requirements Clarification
  zh-CN: 需求决策澄清
category: engineering
visibility: public
version: 0.2.0
status: beta
default_locale: zh-CN
supported_locales:
  - en
  - zh-CN
description:
  en: Close consequential product, behavior, data, permission, compatibility, and acceptance decisions through an evidence-first decision-tree interview. Use for a vague or disputed request before specification; choose fast, standard, or documented mode. Do not use when a testable specification already exists or to implement code. Automatic invocation is appropriate only when material ambiguity is evident; durable terminology or ADR edits require explicit write authorization.
  zh-CN: 通过证据优先的问题树访谈，关闭会影响产品、行为、数据、权限、兼容性和验收的重要决策。用于规格化前仍模糊或存在争议的需求，可选 fast、standard 或 documented 模式。已有可测试规格或需要实施代码时不使用；仅在明显存在重大歧义时适合自动调用，持久术语或 ADR 修改必须获得明确写权限。
triggers:
  en:
    - clarify the unresolved requirements decisions
    - identify questions before writing the specification
    - close the important product and compatibility choices
    - interview me about this vague feature
    - requirements clarification
  zh-CN:
    - 澄清尚未解决的需求决策
    - 写规格前找出关键问题
    - 关闭重要产品和兼容性选择
    - 访谈澄清这个模糊功能
    - 需求决策澄清
tool_requirements:
  filesystem: write
  git: optional
  shell: none
  web: none
permissions:
  read_files: true
  write_files: true
  run_shell_commands: false
  access_network: false
  destructive_actions_allowed: false
risk_level:
  default: safe_edit
output_schema:
  type: requirements_clarification_summary
localization:
  en:
    status: complete
  zh-CN:
    status: complete
