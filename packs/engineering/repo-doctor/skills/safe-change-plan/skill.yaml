id: repo.safe-change-plan
name:
  en: Safe Change Plan
  zh-CN: 安全变更计划
category: engineering
visibility: public
version: 0.2.1
status: beta
default_locale: zh-CN
supported_locales:
  - en
  - zh-CN
description:
  en: Plan a confirmed change, repair, or multi-behavior delivery as atomic-steps or independently verifiable vertical work-items with dependencies, safe parallelism, conflict areas, acceptance, tests, risks, and rollback. Nest necessary code steps within work items for a complete plan. Use settled requirements and sufficient impact evidence; route unknown decisions or missing specifications to requirements-clarification and unknown impact to change-impact-analysis. Return Markdown only without file writes, Shell, external tasks, or implementation.
  zh-CN: 将已确认变更、修复或多行为交付规划为 atomic-steps 原子步骤或可独立验证的 work-items 垂直工作项，覆盖依赖、安全并行、冲突区域、验收、测试、风险和回滚。完整计划将必要代码步骤嵌入工作项。需要已闭合需求和充分影响证据。未决需求或缺少规格交给 requirements-clarification，未知影响交给 change-impact-analysis。只返回 Markdown，不写文件、不调用 Shell、不创建外部任务或执行实施。
triggers:
  en:
    - split the approved specification into vertical work items
    - plan dependencies and safe parallel delivery
    - create a safe implementation plan
    - plan this confirmed change
    - make an atomic rollback-ready change plan
    - safe change plan
  zh-CN:
    - 把已确认规格拆成垂直交付工作项
    - 规划依赖与安全并行交付
    - 制定安全实施计划
    - 为这个已确认变更拆解步骤
    - 生成可回滚的原子变更计划
    - 安全变更计划
tool_requirements:
  filesystem: read
  git: optional
  shell: none
  web: none
permissions:
  read_files: true
  write_files: false
  run_shell_commands: false
  access_network: false
  destructive_actions_allowed: false
risk_level:
  default: advisory
execution:
  classification: lightweight
  default_mode: fast
  allow_implicit_invocation: true
output_schema:
  type: safe_change_plan
localization:
  en:
    status: complete
  zh-CN:
    status: complete
